name: PhoneBoxMac
options:
  bundleIdPrefix: vn.xox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4DU4BTV46U
    CODE_SIGN_STYLE: Automatic
targets:
  PhoneBoxMac:
    type: application
    platform: macOS
    sources:
      - path: PhoneBoxMac
        type: syncedFolder
      # The repo's installer ships inside the app so a Mac without the agent can set it up (see AgentInstaller.swift).
      - path: ../setup.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.phonebox.mac
        PRODUCT_NAME: PhoneBox
        INFOPLIST_FILE: PhoneBoxMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneBoxMac/PhoneBoxMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  PhoneBoxMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhoneBoxMacTests
        type: syncedFolder
    dependencies:
      - target: PhoneBoxMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.phonebox.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhoneBox.app/Contents/MacOS/PhoneBox
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PhoneBoxMac:
    build:
      targets:
        PhoneBoxMac: all
    test:
      targets:
        - PhoneBoxMacTests
